providers = ["python"]

[phases.setup]
nixPkgs = ["python311Full"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["python manage.py migrate", "python manage.py collectstatic --noinput"]

[start]
cmd = "gunicorn backend.wsgi --bind 0.0.0.0:$PORT --workers 2"