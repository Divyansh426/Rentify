[phases.setup]
nixPkgs = ["python311Full", "python311Packages.pip"]

[phases.install]
cmds = ["python3.11 -m pip install -r requirements.txt"]

[phases.build]
cmds = ["python3.11 manage.py migrate", "python3.11 manage.py collectstatic --noinput"]

[start]
cmd = "python3.11 -m gunicorn backend.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --preload"